<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>涟漪素材验收案例</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="root">
  <header class="site-header"><h1>涟漪素材验收案例</h1></header>
  <section class="hero" data-container="home-hero">
    <img src="/media/hero-portrait.jpg" alt="hero" data-consumer="home-hero" />
    <p class="hero-caption">首页 Hero · 16:9 容器 · object-fit: cover · position: center</p>
  </section>
  <section class="activity" data-container="activity-banner">
    <div class="activity-box">
      <img src="/media/hero-portrait.jpg" alt="activity" data-consumer="activity-banner" />
    </div>
    <p>活动页面图片区域 · 4:3 容器 · object-fit: cover · position: 50% 20%</p>
  </section>
  <section class="cards">
    <div class="product-card" data-container="product-card">
      <img src="/media/hero-portrait.jpg" alt="product" data-consumer="product-card" />
      <span>商品卡片 · 240×240 · object-fit: cover · position: top</span>
    </div>
  </section>
</div>

</html>
