name: Agent D Runtime Identity — official Vite/React

on:
  push:
    branches:
      - feat/agent-d-runtime-identity-20261021
  pull_request:
    paths:
      - 'src/core/source-annotation.ts'
      - 'src/core/runtime-identity.ts'
      - 'src/core/runtime-identity.test.ts'
      - 'src/core/project.ts'
      - 'src/core/project.test.ts'
      - 'src/core/model.ts'
      - 'e2e/source-identity.spec.ts'
      - 'e2e/source-identity-fixture/**'
      - '.github/workflows/agent-d-runtime-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Official TypeScript check
        run: npm run typecheck
      - name: Runtime Identity and Project regression (official Vitest)
        run: npx vitest run src/core/runtime-identity.test.ts src/core/project.test.ts --no-file-parallelism
      - name: Official Vite build
        run: npm run build
      - name: Real Vite/plugin-react Chromium identity E2E
        run: npx playwright test e2e/source-identity.spec.ts
      - name: Upload failures/traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-d-runtime-identity-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
