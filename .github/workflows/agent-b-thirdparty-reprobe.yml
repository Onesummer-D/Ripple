name: Agent B third-party (codescandy) reprobe
on:
  push:
    branches:
      - feat/b-thirdparty-reprobe-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirdparty-reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch exact codescandy source (do not execute its dependencies)
        run: |
          git clone --filter=blob:none https://github.com/codescandy/dash-ui-react-vitejs-typescript.git "$RUNNER_TEMP/codescandy"
          git -C "$RUNNER_TEMP/codescandy" checkout --detach b700bbd55b31a62fe04d4cd8210fc37232f0c9f0
          test "$(git -C "$RUNNER_TEMP/codescandy" rev-parse HEAD)" = b700bbd55b31a62fe04d4cd8210fc37232f0c9f0
      - name: Capability stats probe (media / TEXT / routes / tokens)
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-thirdparty-reprobe-stats.mjs "$RUNNER_TEMP/codescandy"
      - name: "Candidate gate reproduction (expected: strictly rejected, exit 0)"
        # Hardened contract test: asserts CandidateError with the exact current
        # provenance reasons, no surviving patch/worktree/mutation; --selftest
        # injects unrelated errors to prove no false green. This frozen negative
        # probe is kept verbatim as regression evidence; the real success path
        # (--expect accepted) runs on the A public core in the
        # accepted-on-a-core job below and locally in b-formal-run.
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-thirdparty-candidate-gate.mjs "$RUNNER_TEMP/codescandy" --selftest --artifacts test-results
      - name: "Candidate accepted positive case (real createCandidate, no mock)"
        # Minimal data-router fixture in a script-owned mkdtemp repo: proves the
        # success contract end-to-end — real patch bytes, patchHash, marker,
        # exact-edit candidate bytes, tree digest, no worktree/artifact residue.
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-candidate-accepted-fixture.mjs --artifacts test-results
      - name: "Accepted-summary unit tests (P0-1: booleans-only pass predicate)"
        # Positive case: all real checks true ⇒ pass === true. Negative cases:
        # any false, non-boolean metadata mixed in, or uncreated candidate ⇒ false.
        run: node --test scripts/b-gate-accepted-summary.test.mjs
      - name: "B-ENV-1 pinned repro (read-only source, independent LF/CRLF clones)"
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-env1-eol-repro.mjs "$RUNNER_TEMP/codescandy" --selftest --artifacts test-results
      - name: "Source proof probe (expected: exit 2 BLOCKED with complete report)"
        # Probe exit semantics: 0 = proof satisfied; 2 = BLOCKED (complete report);
        # 1 = hard failure. Current expected state is 2 — treat it as a passing
        # contract check; 0 means the blocker was lifted and expectations must be
        # updated; any other code fails.
        run: |
          set +e
          node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/agent-c-codescandy-probe.mjs "$RUNNER_TEMP/codescandy" test-results/agent-b-codescandy-reprobe.json
          code=$?
          echo "probe exit=$code"
          if [ "$code" -eq 2 ]; then echo "expected BLOCKED state confirmed"; exit 0; fi
          if [ "$code" -eq 0 ]; then echo "unexpected: source proof satisfied — update matrix expectations"; exit 1; fi
          exit "$code"
      - name: Retain probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-thirdparty-reprobe-${{ github.run_id }}
          path: |
            test-results/agent-b-codescandy-reprobe.json
            test-results/b-thirdparty-reprobe-stats.json
            test-results/candidate-gate.json
            test-results/candidate-accepted-fixture.json
            test-results/b-env1-eol-repro.json
          retention-days: 30
          if-no-files-found: warn

  # Formal ACCEPTED run: the gate script executes against the A public core
  # integration SHA (not the B branch core). The gate hard-fails unless HEAD
  # equals --core-sha and carries the AC-P2a/b lineage ancestor, so a stale or
  # substituted core cannot produce a green ACCEPTED.
  accepted-on-a-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A final integration candidate: includes codescandy compat (bounded
      # existence-fallback for bare '*' aliases + root-bounded host resolution,
      # 6f22551 via ce7bc60) — lifts the wildcard-alias preview blocker.
      A_CORE_SHA: 2f2e5a708bff554775bea539fb659974203e67b8
      ACP2_ANCESTOR: f804c7e0908e6dc8831c46ca55b92d357df72c10
      CODESCANDY_SHA: b700bbd55b31a62fe04d4cd8210fc37232f0c9f0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact codescandy source (do not execute its dependencies)
        run: |
          git clone --filter=blob:none https://github.com/codescandy/dash-ui-react-vitejs-typescript.git "$RUNNER_TEMP/codescandy"
          git -C "$RUNNER_TEMP/codescandy" checkout --detach "$CODESCANDY_SHA"
          test "$(git -C "$RUNNER_TEMP/codescandy" rev-parse HEAD)" = "$CODESCANDY_SHA"
      - name: Check out A public core integration SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.A_CORE_SHA }}
          path: a-core
          # full history is required: the provenance check (and the gate's own
          # coreVerification) runs merge-base --is-ancestor against the AC-P2a/b
          # lineage, which a shallow fetch cannot resolve
          fetch-depth: 0
      - name: Verify A core provenance (HEAD equals declared SHA and carries AC-P2a/b lineage)
        run: |
          test "$(git -C a-core rev-parse HEAD)" = "$A_CORE_SHA"
          git -C a-core merge-base --is-ancestor "$ACP2_ANCESTOR" HEAD
      - name: Install A core dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: a-core
      - name: Transplant B gate scripts onto A core byte-for-byte
        run: |
          cp scripts/b-thirdparty-candidate-gate.mjs a-core/scripts/b-thirdparty-candidate-gate.mjs
          cp scripts/b-gate-accepted-summary.mjs a-core/scripts/b-gate-accepted-summary.mjs
          cp scripts/ts-extension-loader.mjs a-core/scripts/ts-extension-loader.mjs
          cmp scripts/b-thirdparty-candidate-gate.mjs a-core/scripts/b-thirdparty-candidate-gate.mjs
          cmp scripts/b-gate-accepted-summary.mjs a-core/scripts/b-gate-accepted-summary.mjs
      - name: "Formal ACCEPTED candidate run on A core (--expect accepted)"
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-thirdparty-candidate-gate.mjs "$RUNNER_TEMP/codescandy" --expect accepted --core-sha "$A_CORE_SHA" --artifacts test-results
        working-directory: a-core
      - name: Retain accepted candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-accepted-on-a-core-${{ github.run_id }}
          path: |
            a-core/test-results/candidate-gate.json
            a-core/test-results/*.patch
          retention-days: 30
          if-no-files-found: warn

  # Formal third-party Verification: re-creates the ACCEPTED candidate on the A
  # public core and drives A's real browser verification (Docker Vite preview +
  # isolated Playwright container, 4 viewports). Requires a Linux host with
  # Docker — the runner and preview explicitly refuse other platforms.
  thirdparty-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same A final integration candidate as accepted-on-a-core (alias fallback).
      A_CORE_SHA: 2f2e5a708bff554775bea539fb659974203e67b8
      ACP2_ANCESTOR: f804c7e0908e6dc8831c46ca55b92d357df72c10
      CODESCANDY_SHA: b700bbd55b31a62fe04d4cd8210fc37232f0c9f0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out A public core integration SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.A_CORE_SHA }}
          path: a-core
          fetch-depth: 0
      - name: Verify A core provenance (HEAD equals declared SHA and carries AC-P2a/b lineage)
        run: |
          test "$(git -C a-core rev-parse HEAD)" = "$A_CORE_SHA"
          git -C a-core merge-base --is-ancestor "$ACP2_ANCESTOR" HEAD
      - name: Install A core dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: a-core
      - name: Fetch pinned codescandy with dependencies (trusted install step)
        run: |
          git clone --quiet https://github.com/codescandy/dash-ui-react-vitejs-typescript.git codescandy-src
          git -C codescandy-src checkout --detach "$CODESCANDY_SHA"
          test "$(git -C codescandy-src rev-parse HEAD)" = "$CODESCANDY_SHA"
          cd codescandy-src
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Pre-pull isolated runner images
        run: |
          docker pull mcr.microsoft.com/playwright:v1.64.0-noble
          docker pull node:22-bookworm-slim
      - name: Transplant B verification script onto A core byte-for-byte
        run: |
          cp scripts/b-candidate-verify.mjs a-core/scripts/b-candidate-verify.mjs
          cp scripts/ts-extension-loader.mjs a-core/scripts/ts-extension-loader.mjs
          cmp scripts/b-candidate-verify.mjs a-core/scripts/b-candidate-verify.mjs
      - name: "Formal candidate Verification on A core (Docker browser runner)"
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-candidate-verify.mjs "$GITHUB_WORKSPACE/codescandy-src" --core-sha "$A_CORE_SHA" --artifacts test-results/verification
        working-directory: a-core
      - name: Retain verification evidence (run record, screenshots, patch, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-verification-${{ github.run_id }}
          path: |
            a-core/test-results/verification/verification-report.json
            a-core/test-results/verification/verification-run.json
            a-core/test-results/verification/candidate-record.json
            a-core/test-results/verification/*.patch
            a-core/test-results/verification/evidence/**
          retention-days: 30
          if-no-files-found: warn
