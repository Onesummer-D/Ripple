name: Agent B third-party (codescandy) reprobe
on:
  push:
    branches:
      - feat/b-thirdparty-reprobe-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirdparty-reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch exact codescandy source (do not execute its dependencies)
        run: |
          git clone --filter=blob:none https://github.com/codescandy/dash-ui-react-vitejs-typescript.git "$RUNNER_TEMP/codescandy"
          git -C "$RUNNER_TEMP/codescandy" checkout --detach b700bbd55b31a62fe04d4cd8210fc37232f0c9f0
          test "$(git -C "$RUNNER_TEMP/codescandy" rev-parse HEAD)" = b700bbd55b31a62fe04d4cd8210fc37232f0c9f0
      - name: Capability stats probe (media / TEXT / routes / tokens)
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-thirdparty-reprobe-stats.mjs "$RUNNER_TEMP/codescandy"
      - name: "Candidate gate reproduction (expected: strictly rejected, exit 0)"
        # Hardened contract test: asserts CandidateError with the exact current
        # provenance reasons, no surviving patch/worktree/mutation; --selftest
        # injects unrelated errors to prove no false green. After AC-P2a/AC-P2b
        # land, switch to: --expect accepted
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-thirdparty-candidate-gate.mjs "$RUNNER_TEMP/codescandy" --selftest --artifacts test-results
      - name: "B-ENV-1 pinned repro (CRLF/LF working-tree states)"
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/b-env1-eol-repro.mjs "$RUNNER_TEMP/codescandy" test-results
      - name: "Source proof probe (expected: exit 2 BLOCKED with complete report)"
        # Probe exit semantics: 0 = proof satisfied; 2 = BLOCKED (complete report);
        # 1 = hard failure. Current expected state is 2 — treat it as a passing
        # contract check; 0 means the blocker was lifted and expectations must be
        # updated; any other code fails.
        run: |
          set +e
          node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/agent-c-codescandy-probe.mjs "$RUNNER_TEMP/codescandy" test-results/agent-b-codescandy-reprobe.json
          code=$?
          echo "probe exit=$code"
          if [ "$code" -eq 2 ]; then echo "expected BLOCKED state confirmed"; exit 0; fi
          if [ "$code" -eq 0 ]; then echo "unexpected: source proof satisfied — update matrix expectations"; exit 1; fi
          exit "$code"
      - name: Retain probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-thirdparty-reprobe-${{ github.run_id }}
          path: |
            test-results/agent-b-codescandy-reprobe.json
            test-results/b-thirdparty-reprobe-stats.json
            test-results/candidate-gate.json
            test-results/b-env1-eol-repro.json
          retention-days: 30
          if-no-files-found: warn
