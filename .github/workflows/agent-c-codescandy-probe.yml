name: Agent C codescandy SourceGraph pinned proof
on:
  push:
    branches:
      - feat/agent-c-sourcegraph-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codescandy-sourcegraph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch exact codescandy source (do not execute its dependencies)
        run: |
          git clone --filter=blob:none https://github.com/codescandy/dash-ui-react-vitejs-typescript.git "$RUNNER_TEMP/codescandy"
          git -C "$RUNNER_TEMP/codescandy" checkout --detach b700bbd55b31a62fe04d4cd8210fc37232f0c9f0
          test "$(git -C "$RUNNER_TEMP/codescandy" rev-parse HEAD)" = b700bbd55b31a62fe04d4cd8210fc37232f0c9f0
      - name: Analyze actual pinned codescandy graph without running target code
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/agent-c-codescandy-probe.mjs "$RUNNER_TEMP/codescandy" test-results/agent-c-codescandy.json
      - name: Retain full provenance JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-codescandy-sourcegraph-${{ github.run_id }}
          path: test-results/agent-c-codescandy.json
          retention-days: 30
          if-no-files-found: warn
