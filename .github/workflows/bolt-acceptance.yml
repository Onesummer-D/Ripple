name: Bolt real-project acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bolt-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Onesummer-D/ripple-qingye-bolt
          token: ${{ secrets.BOLT_REPO_TOKEN }}
          path: bolt-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Bolt dependencies without running lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix bolt-source/project
      - name: Install Chromium for the acceptance runner
        run: mkdir -p "$RUNNER_TEMP/ripple-acceptance/playwright-browsers" && npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ripple-acceptance/playwright-browsers
      - name: Require Docker for isolated candidate preview
        run: docker info --format '{{.ServerVersion}}'
      - name: Warm the supported preview runtime image
        run: docker pull node:22-bookworm-slim
      - name: Verify the real Bolt project through the Ripple workbench
        run: npm run test:browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ripple-acceptance/playwright-browsers
          RIPPLE_BOLT_PROJECT: ${{ github.workspace }}/bolt-source/project
          RIPPLE_BROWSER_ARTIFACT_DIR: test-results/evidence-bolt-workbench
      - name: Preserve real-workbench browser screenshots and run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-bolt-workbench-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Run real Bolt isolated-candidate browser acceptance
        run: npm run acceptance:bolt -- "$GITHUB_WORKSPACE/bolt-source/project" "$RUNNER_TEMP/ripple-acceptance"
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ripple-acceptance/playwright-browsers
      - name: Preserve screenshots, pixel diffs and execution record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-bolt-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/ripple-acceptance/artifacts/
          if-no-files-found: warn
          retention-days: 30

