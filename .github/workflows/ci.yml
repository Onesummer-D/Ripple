name: Ripple CI

concurrency:
  group: ripple-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    # 2026-10-23: observed Azure apt mirror throttling to ~24 kB/s on
    # playwright --with-deps (12 min for 16.9 MB alone) twice in a row,
    # eating the 20-minute budget before any test ran. Raised to 30 to
    # absorb transient mirror slowness; all gates unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures/react-vite-tailwind/package-lock.json
      - run: npm ci
      - name: Install the pinned React/Vite/Tailwind preview fixture
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix test/fixtures/react-vite-tailwind
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Unit tests (the live resource snapshot probe needs real egress)
        run: npm test -- --run --no-file-parallelism
        env:
          # Exercises the real HTTPS snapshotter (DNS pinning + public-IP
          # check + TLS) on the runner. The Bolt workflow is the only other
          # place this path runs; without this probe regressions reach the
          # 16-minute acceptance run undetected (Run #9 lost all 19 resources
          # in 62 ms and nothing else noticed).
          RIPPLE_LIVE_RESOURCE_TEST: '1'
      - run: npm run build
      - name: Require Docker for isolated candidate browser preview
        run: docker info --format '{{.ServerVersion}}'
      - name: Warm the supported preview runtime image
        run: docker pull node:22-bookworm-slim
      - name: Prepare and smoke-test the isolated browser runtime
        run: bash scripts/prepare-browser-verification.sh
      - name: Focused Candidate timeout diagnostic (Linux / Docker / Chromium)
        run: npm run test:browser -- e2e/experience-real-flow.spec.ts
      - name: Preserve browser screenshots, traces and run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-browser-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
