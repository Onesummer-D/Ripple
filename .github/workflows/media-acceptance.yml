name: Qingye real-project MEDIA acceptance

on:
  workflow_dispatch:
    inputs:
      ripple_sha:
        # P0-1：显式固定经独立审查的 Ripple 提交，不依赖触发分支或默认 main 的内容——
        # main 尚未集成 MEDIA 验收代码，默认检出会找不到验收脚本。
        # 更改默认值必须由负责人重新走审查流程。
        description: '经独立审查的 Ripple 提交 SHA（须含 scripts/media-qingye-acceptance.ts）'
        required: true
        default: 'd01604c49103338d7aea5686fffd6b762ae88f1a'
        type: string

permissions:
  contents: read

jobs:
  media-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 检出内容与触发分支无关，永远是经审核的固定 SHA（见验收门槛）
          ref: ${{ inputs.ripple_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Onesummer-D/ripple-qingye-bolt
          # 固定验收源码版本，与 acceptance.json 的 qingyeCommit 绑定，可复现
          ref: f7e4998a5c77ab4aeb3232dbc31e61196e9051a6
          token: ${{ secrets.BOLT_REPO_TOKEN }}
          path: qingye-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify checked-out Ripple SHA matches the reviewed input
        run: test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ inputs.ripple_sha }}"
      - name: Record both source SHAs for reproducibility
        run: |
          echo "Ripple HEAD: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "Qingye HEAD: f7e4998a5c77ab4aeb3232dbc31e61196e9051a6"
      - name: Assert the real acceptance entrypoint exists in the checked-out Ripple workspace
        run: test -f scripts/media-qingye-acceptance.ts
      - name: Assert checkout credentials were not persisted
        run: node --experimental-transform-types scripts/assert-no-checkout-credentials.ts "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/qingye-source"
      - run: npm ci
      - name: Install Chromium for the MEDIA evidence collector
        run: npx playwright install --with-deps chromium
      - name: Run the real Qingye MEDIA asset-swap acceptance
        run: node --experimental-transform-types --loader ./scripts/ts-extension-loader.mjs scripts/media-qingye-acceptance.ts "$GITHUB_WORKSPACE/qingye-source" "$RUNNER_TEMP/ripple-media-acceptance"
      - name: Preserve acceptance evidence, screenshots and run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-qingye-media-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ripple-media-acceptance/**
          if-no-files-found: warn
          retention-days: 30
